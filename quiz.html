<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz — EiFF Project</title>
    <meta name="description" content="Test your vocabulary knowledge. Score 80%+ to unlock the next level.">
    <link rel="icon" href="assets/favicon.ico.png" type="image/png">
    <link rel="stylesheet" href="css/style.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Cairo:wght@400;600;700;800&family=Pacifico&display=swap"
        rel="stylesheet">
</head>

<body>

    <!-- TOPBAR -->
    <header class="topbar" role="banner">
        <a href="dashboard.html" class="nav-logo" aria-label="Back to Dashboard">
            <img src="assets/logo-nav.png" alt="EiFF Project">
        </a>
        <div class="nav-actions">
            <button class="btn-secondary" id="btn-signout">Sign Out</button>
        </div>
    </header>

    <!-- MAIN -->
    <main>
        <div class="quiz-wrapper">

            <!-- Progress -->
            <div class="quiz-progress-bar" role="progressbar" aria-valuemin="0" aria-valuemax="10" aria-valuenow="0"
                id="progress-bar-container">
                <div class="quiz-progress-fill" id="progress-fill" style="width:0%"></div>
            </div>
            <div class="quiz-progress-text">
                <span id="q-counter">Question 1 of 10</span>
                <span class="quiz-score-badge" id="score-badge">Score: 0</span>
            </div>

            <!-- Quiz card (replaced each question) -->
            <div id="quiz-area">
                <div class="loading-spinner" role="status">
                    <div class="spinner"></div>
                    <span>Preparing quiz…</span>
                </div>
            </div>

            <!-- Next button -->
            <div class="quiz-nav">
                <button class="btn-next-q" id="btn-next" aria-label="Next question">Next →</button>
            </div>

        </div>
    </main>

    <!-- TOAST -->
    <div class="toast" id="eiff-toast" role="status" aria-live="polite"></div>

    <!-- SCRIPTS -->
    <script type="module">
        import { vocabData } from './js/data-sector1A.js';
        import { auth, onAuthStateChanged, getUserData, unlockNextLevel, eiffSignOut } from './js/firebase-config.js';
        import { showToast } from './js/auth-ui.js';

        // ─── Config ────────────────────────────────
        const QUIZ_SIZE = 10;
        const PASS_SCORE = 0.8;   // 80%
        const CHOICES_COUNT = 4;

        // ─── Parse URL ─────────────────────────────
        const params = new URLSearchParams(window.location.search);
        const chapter = parseInt(params.get('chapter')) || 1;
        const level = parseInt(params.get('level')) || 1;
        const globalLevel = (chapter - 1) * 6 + level;

        // ─── State ─────────────────────────────────
        let currentUser = null;
        let quizWords = [];
        let allWords = [];   // All words in this level (for distractors)
        let qIndex = 0;
        let score = 0;
        let answered = false;

        // ─── Auth Guard ────────────────────────────
        onAuthStateChanged(auth, async (user) => {
            if (!user) { window.location.href = 'index.html'; return; }
            currentUser = user;
            initQuiz();
        });

        // ─── Sign Out ──────────────────────────────
        document.getElementById('btn-signout').addEventListener('click', async () => {
            await eiffSignOut();
            window.location.href = 'index.html';
        });

        // ─── Build Quiz ────────────────────────────
        function initQuiz() {
            const levelWords = (vocabData[chapter] && vocabData[chapter][level]) ? vocabData[chapter][level] : [];

            if (levelWords.length < 4) {
                document.getElementById('quiz-area').innerHTML = `
                <div class="quiz-card">
                    <p style="text-align:center; color:var(--text-2); font-size:1.05rem;">
                        📭 Not enough words for a quiz yet.<br>
                        Paste your data into <code>js/data-sector1A.js</code>
                    </p>
                </div>`;
                return;
            }

            allWords = [...levelWords];
            quizWords = shuffle(levelWords).slice(0, Math.min(QUIZ_SIZE, levelWords.length));
            document.title = `Quiz Ch.${chapter} Lv.${level} — EiFF`;
            showQuestion();
        }

        // ─── Render a Question ─────────────────────
        function showQuestion() {
            if (qIndex >= quizWords.length) { showResults(); return; }

            answered = false;
            const word = quizWords[qIndex];
            const pct = (qIndex / quizWords.length) * 100;
            const progress = document.getElementById('progress-fill');
            const counter = document.getElementById('q-counter');
            const scoreBadge = document.getElementById('score-badge');
            const btnNext = document.getElementById('btn-next');
            const progressBar = document.getElementById('progress-bar-container');

            progress.style.width = pct + '%';
            progressBar.setAttribute('aria-valuenow', qIndex);
            counter.textContent = `Question ${qIndex + 1} of ${quizWords.length}`;
            scoreBadge.textContent = `Score: ${score}`;
            btnNext.style.display = 'none';

            // Build choices: 1 correct + 3 distractors
            const distractors = shuffle(
                allWords.filter(w => w.en !== word.en)
            ).slice(0, CHOICES_COUNT - 1);

            const choices = shuffle([word, ...distractors]);

            const area = document.getElementById('quiz-area');
            area.innerHTML = `
        <div class="quiz-card" id="quiz-card" role="group" aria-labelledby="quiz-question">
            <div class="quiz-q-label">What is the Arabic meaning of…</div>
            <div class="quiz-question" id="quiz-question">${word.en}</div>
            <div class="quiz-choices" role="group" aria-label="Answer choices">
                ${choices.map((c, i) => `
                    <button
                        class="quiz-choice"
                        id="choice-${i}"
                        data-en="${c.en}"
                        aria-label="${c.ar}"
                    >${c.ar}<br><small style="font-size:0.75rem; color:var(--text-3)">${c.eg}</small></button>
                `).join('')}
            </div>
            <div class="quiz-feedback" id="quiz-feedback" role="alert"></div>
        </div>`;

            // Attach choice listeners
            document.querySelectorAll('.quiz-choice').forEach(btn => {
                btn.addEventListener('click', () => handleAnswer(btn, word.en));
            });
        }

        // ─── Handle Answer ─────────────────────────
        function handleAnswer(selectedBtn, correctEn) {
            if (answered) return;
            answered = true;

            const isCorrect = selectedBtn.dataset.en === correctEn;
            const feedbackEl = document.getElementById('quiz-feedback');
            const btnNext = document.getElementById('btn-next');

            // Disable all choices
            document.querySelectorAll('.quiz-choice').forEach(btn => {
                btn.disabled = true;
                if (btn.dataset.en === correctEn) {
                    btn.classList.add('correct');
                } else if (btn === selectedBtn && !isCorrect) {
                    btn.classList.add('wrong');
                }
            });

            if (isCorrect) {
                score++;
                feedbackEl.className = 'quiz-feedback correct';
                feedbackEl.textContent = '✅ Correct! Well done!';
            } else {
                feedbackEl.className = 'quiz-feedback wrong';
                const correctWord = document.querySelector(`.quiz-choice[data-en="${correctEn}"]`);
                feedbackEl.textContent = `❌ The correct answer was: ${correctWord?.querySelector(':first-child')?.textContent || correctEn}`;
            }
            feedbackEl.style.display = 'block';

            document.getElementById('score-badge').textContent = `Score: ${score}`;
            btnNext.style.display = 'block';
        }

        // ─── Next Button ───────────────────────────
        document.getElementById('btn-next').addEventListener('click', () => {
            qIndex++;
            showQuestion();
        });

        // ─── Show Results ──────────────────────────
        async function showResults() {
            const pct = score / quizWords.length;
            const passed = pct >= PASS_SCORE;
            const pctDisplay = Math.round(pct * 100);

            // Update progress bar to 100%
            document.getElementById('progress-fill').style.width = '100%';
            document.getElementById('q-counter').textContent = 'Quiz Complete!';
            document.getElementById('btn-next').style.display = 'none';

            let unlockMsg = '';
            let newLevelUnlocked = false;

            // Try to unlock next level if passed
            if (passed && currentUser) {
                try {
                    const userData = await getUserData(currentUser.uid);
                    if (userData?.unlockedLevel === globalLevel) {
                        newLevelUnlocked = await unlockNextLevel(currentUser.uid, globalLevel);
                    }
                } catch (err) {
                    console.error('Error unlocking level:', err);
                }
            }

            if (passed && newLevelUnlocked) {
                unlockMsg = `
                <div class="unlock-badge" aria-live="assertive">
                    🏆 Level ${globalLevel + 1} Unlocked!
                </div>`;
            } else if (passed) {
                unlockMsg = `
                <div class="unlock-badge">
                    ⭐ Great job! Keep it up!
                </div>`;
            }

            const area = document.getElementById('quiz-area');
            area.innerHTML = `
        <div class="quiz-result-card" role="main" aria-label="Quiz results">
            ${passed
                    ? '<div class="result-icon" aria-hidden="true">🎉</div>'
                    : '<div class="result-icon" aria-hidden="true">😤</div>'
                }
            <h2 class="result-title">${passed ? 'You Passed!' : 'Not Quite!'}</h2>
            <div class="result-score-big ${passed ? 'pass' : 'fail'}" aria-label="${pctDisplay}%">
                ${pctDisplay}%
            </div>
            <p class="result-msg">
                ${passed
                    ? `You got ${score} out of ${quizWords.length} correct. Excellent work!`
                    : `You got ${score} out of ${quizWords.length}. You need 80% to pass. Keep practicing!`
                }
            </p>

            ${unlockMsg}

            <div class="result-actions">
                ${passed
                    ? `<button class="btn-result btn-result-green" onclick="window.location.href='dashboard.html'">
                            Continue →
                        </button>`
                    : `<button class="btn-result btn-result-blue" onclick="window.location.reload()">
                            Retry Quiz 🔄
                        </button>`
                }
                <button class="btn-result btn-result-outline"
                    onclick="window.location.href='study.html?chapter=${chapter}&level=${level}'">
                    Study Again 📖
                </button>
                <button class="btn-result btn-result-outline"
                    onclick="window.location.href='dashboard.html'">
                    Dashboard 🏠
                </button>
            </div>
        </div>`;
        }

        // ─── Helpers ───────────────────────────────
        function shuffle(arr) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }
    </script>

</body>

</html>
