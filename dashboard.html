<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard — EiFF Project</title>
    <meta name="description" content="Choose your level and start learning English vocabulary with EiFF.">
    <link rel="icon" href="assets/favicon.ico.png" type="image/png">
    <link rel="stylesheet" href="css/style.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Cairo:wght@400;600;700;800&family=Pacifico&display=swap"
        rel="stylesheet">
</head>

<body>

    <!-- TOPBAR -->
    <header class="topbar" role="banner">
        <a href="index.html" class="nav-logo" aria-label="EiFF Home">
            <img src="assets/logo-nav.png" alt="EiFF Project">
        </a>

        <!-- Hamburger toggle (mobile only) -->
        <button class="chap-hamburger" id="chap-hamburger" aria-label="Toggle chapter menu" aria-expanded="false">
            <span></span><span></span><span></span>
        </button>

        <!-- Chapter pills -->
        <nav class="nav-pills" id="chap-nav" aria-label="Chapter navigation"></nav>

        <div class="nav-actions">
            <button class="msg-btn" id="btn-msg" style="display:none;" aria-label="Messages">🔔</button>
            <a href="leaderboard.html" class="btn-leaderboard" id="btn-leaderboard" aria-label="Leaderboard">🏆 LEADERBOARD</a>
            <button class="btn-secondary" id="btn-signout" aria-label="Sign out">Sign Out</button>
        </div>
    </header>

    <!-- MAIN -->
    <main>
        <!-- Page header + user badge -->
        <div class="page-header" id="page-header">
            <h1>📚 Level Selection</h1>
            <p>Complete all 6 levels → pass the Master Quiz → unlock the next chapter.</p>
            <div class="user-badge" id="user-badge" aria-live="polite">
                <div class="user-badge-avatar" id="user-avatar">?</div>
                <span id="user-name">Loading…</span>
            </div>
        </div>

        <!-- Level Grid -->
        <section id="levels-container" aria-label="Study levels">
            <div class="loading-spinner" role="status">
                <div class="spinner"></div>
                <span>Loading your progress…</span>
            </div>
        </section>
    </main>

    <!-- TOAST -->
    <div class="toast" id="eiff-toast" role="status" aria-live="polite"></div>

    <!-- MESSAGE MODAL -->
    <div class="msg-modal-overlay" id="msg-modal">
        <div class="msg-modal">
            <span class="msg-icon">📩</span>
            <div class="msg-text" id="msg-text-content"></div>
            <button class="btn-msg-okay" id="btn-msg-okay">Okay</button>
        </div>
    </div>

    <!-- SCRIPTS -->
    <script type="module">
        import { auth, onAuthStateChanged, getUserData, eiffSignOut, markMessageRead } from './js/firebase-config.js';
        import { showToast } from './js/auth-ui.js';

        // ─── Config ────────────────────────────────
        const TOTAL_CHAPTERS = 10;
        const LEVELS_PER_CHAP = 6;
        const WORDS_PER_LEVEL = 50;

        // ─── State ─────────────────────────────────
        let currentUser = null;
        let userData = null;
        let activeChapter = 1;

        // ─── Auth Guard ─────────────────────────────
        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = 'index.html';
                return;
            }
            currentUser = user;
            userData = await getUserData(user.uid);

            // Populate user badge
            const name = userData?.displayName || user.email.split('@')[0];
            document.getElementById('user-name').textContent = name;
            document.getElementById('user-avatar').textContent = name[0].toUpperCase();

            // Check for admin messages
            const msgs = userData?.messages || [];
            if (msgs.length > 0) {
                const btnMsg = document.getElementById('btn-msg');
                btnMsg.style.display = 'inline-block';

                const unreadMsgs = msgs.filter(m => !m.read);
                if (unreadMsgs.length > 0) {
                    btnMsg.classList.add('shake-bell');
                    // Automatically pop up the LAST unread message
                    const latestUnread = unreadMsgs[unreadMsgs.length - 1];
                    document.getElementById('msg-text-content').innerHTML = `
                        <div style="font-size: 0.8rem; color: #64748b; margin-bottom: 8px;">New Message!</div>
                        <div>${latestUnread.text}</div>
                    `;
                    
                    // Delay sudden popup slightly so it looks cool
                    setTimeout(() => {
                        document.getElementById('msg-modal').classList.add('open');
                    }, 600);
                }

                // If user clicks the bell icon, open the history view
                btnMsg.onclick = () => {
                    const content = document.getElementById('msg-text-content');
                    content.innerHTML = '<div style="max-height: 260px; overflow-y: auto; text-align: left; padding: 0 5px;">' +
                        msgs.slice().reverse().map(m => `
                            <div style="background: #f1f5f9; margin-bottom: 12px; padding: 12px; border-radius: 10px; border-left: 4px solid var(--g-blue, #3b82f6); font-size: 0.95rem;">
                                <div style="font-size: 0.7rem; color: #64748b; margin-bottom: 5px; font-weight: 700; text-transform: uppercase;">
                                    ${new Date(m.timestamp).toLocaleDateString([], { month: 'short', day: 'numeric', hour: '2-digit', minute:'2-digit' })}
                                </div>
                                ${m.text}
                            </div>
                        `).join('') + '</div>';
                        
                    document.getElementById('msg-modal').classList.add('open');
                };

                // The single Okay button handles both views
                document.getElementById('btn-msg-okay').onclick = async () => {
                    document.getElementById('msg-modal').classList.remove('open');
                    btnMsg.classList.remove('shake-bell');
                    
                    // Mark all unread messages as read in Firestore
                    if (unreadMsgs.length > 0) {
                        for (const m of unreadMsgs) {
                            m.read = true;
                            await markMessageRead(user.uid, m.id);
                        }
                    }
                };
            }

            // Build navigation & levels
            buildChapterNav();

            // Read ?chapter=X from URL to resume the right chapter
            const urlParams = new URLSearchParams(window.location.search);
            const startCh = Math.max(1, Math.min(10, parseInt(urlParams.get('chapter')) || 1));
            // Clamp to what's actually unlocked
            const safeStartCh = Math.min(startCh, userData?.unlockedChapter ?? 1);
            activeChapter = safeStartCh;
            showChapterLevels(safeStartCh);

            // Mark the correct pill as active
            document.querySelectorAll('.pill-btn').forEach(b => b.classList.remove('active'));
            const activePill = document.getElementById(`chap-btn-${safeStartCh}`);
            if (activePill) activePill.classList.add('active');
        });

        // ─── Sign Out ───────────────────────────────
        document.getElementById('btn-signout').addEventListener('click', async () => {
            await eiffSignOut();
            window.location.href = 'index.html';
        });

        // ─── Build Chapter Nav Pills ─────────────────
        function buildChapterNav() {
            const nav = document.getElementById('chap-nav');
            nav.innerHTML = '';
            const unlockedChapter = userData?.unlockedChapter ?? 1;

            for (let c = 1; c <= TOTAL_CHAPTERS; c++) {
                const isChapterLocked = c > unlockedChapter;
                const btn = document.createElement('button');
                btn.className = 'pill-btn' + (c === 1 ? ' active' : '') + (isChapterLocked ? ' pill-locked' : '');
                btn.textContent = isChapterLocked ? `🔒 Ch ${c}` : `Chapter ${c}`;
                btn.id = `chap-btn-${c}`;
                btn.setAttribute('aria-pressed', c === 1 ? 'true' : 'false');
                btn.addEventListener('click', () => {
                    if (isChapterLocked) {
                        showToast('🔒 Pass the previous chapter\'s Master Quiz to unlock!');
                        return;
                    }
                    document.querySelectorAll('.pill-btn').forEach(b => {
                        b.classList.remove('active');
                        b.setAttribute('aria-pressed', 'false');
                    });
                    btn.classList.add('active');
                    btn.setAttribute('aria-pressed', 'true');
                    activeChapter = c;
                    showChapterLevels(c);
                    document.getElementById('chap-nav').classList.remove('open');
                    document.getElementById('chap-hamburger').setAttribute('aria-expanded', 'false');
                    document.getElementById('chap-hamburger').classList.remove('is-open');
                });
                nav.appendChild(btn);
            }

            // Chapter X Pill (Only visible if unlockedChapter >= 11)
            if (unlockedChapter >= 11) {
                const btnX = document.createElement('button');
                btnX.className = 'pill-btn pill-btn-chapx';
                btnX.style.cssText = 'background: #1e293b; color: #ffffff; border: 1px solid #334155; font-weight: 800; text-shadow: 0 1px 2px rgba(0,0,0,0.5);';
                btnX.textContent = '⭐ Chapter X';
                btnX.id = `chap-btn-11`;
                btnX.setAttribute('aria-pressed', 'false');
                btnX.addEventListener('click', () => {
                    document.querySelectorAll('.pill-btn').forEach(b => {
                        b.classList.remove('active');
                        b.setAttribute('aria-pressed', 'false');
                    });
                    btnX.classList.add('active');
                    btnX.setAttribute('aria-pressed', 'true');
                    activeChapter = 11;
                    showChapterLevels(11);
                    document.getElementById('chap-nav').classList.remove('open');
                    document.getElementById('chap-hamburger').setAttribute('aria-expanded', 'false');
                    document.getElementById('chap-hamburger').classList.remove('is-open');
                });
                nav.appendChild(btnX);
            }

            // Hamburger toggle logic
            const hamburger = document.getElementById('chap-hamburger');
            hamburger.addEventListener('click', () => {
                const isOpen = nav.classList.toggle('open');
                hamburger.setAttribute('aria-expanded', isOpen);
                hamburger.classList.toggle('is-open', isOpen);
            });
        }

        // ─── Show Levels + Master Quiz Card for a Chapter ────────
        function showChapterLevels(chapter) {
            const container = document.getElementById('levels-container');
            const unlockedLevel = userData?.unlockedLevel ?? 1;
            const unlockedChapter = userData?.unlockedChapter ?? 1;

            container.innerHTML = '<div class="levels-grid" id="levels-grid"></div>';
            const grid = document.getElementById('levels-grid');

            // ── CHAPTER X VIEW (chapter === 11) ──────────────────────
            if (chapter === 11) {
                // Grand Quiz Card
                const grandCard = document.createElement('div');
                grandCard.className = `level-card grand-card`;
                grandCard.setAttribute('role', 'button');
                grandCard.setAttribute('tabindex', '0');
                grandCard.setAttribute('aria-label', 'Grand Quiz — all chapters, 250 questions');
                grandCard.innerHTML = `
                    <div class="level-icon" aria-hidden="true">🌟</div>
                    <div class="level-label" style="background: linear-gradient(135deg,#f59e0b,#ef4444,#3b82f6);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent; font-size: 1.3rem;">GRAND QUIZ</div>
                    <div class="level-range">All 10 Chapters · 250 Questions</div>
                    <div class="master-hint" style="color:#f59e0b;">Master all chapters in one grand exam</div>
                `;
                grandCard.addEventListener('click', () => {
                    window.location.href = `quiz.html?type=grand`;
                });
                grandCard.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' || e.key === ' ') grandCard.click();
                });
                grid.appendChild(grandCard);

                // THE FINAL BOSS Card
                const hasPassedGrand = userData?.grandQuizPassed === true;
                const bossCard = document.createElement('div');
                bossCard.className = `level-card master-card${!hasPassedGrand ? ' locked' : ''}`;
                bossCard.style.cssText = hasPassedGrand 
                    ? 'background: linear-gradient(135deg, #1e1b4b, #0f172a); border: 2px solid #ef4444; box-shadow: 0 8px 25px rgba(239,68,68,0.25);'
                    : 'background: #0f172a; border: 1px solid #334155;';
                bossCard.setAttribute('role', 'button');
                bossCard.setAttribute('tabindex', hasPassedGrand ? '0' : '-1');
                bossCard.setAttribute('aria-label', 'THE FINAL BOSS');

                bossCard.innerHTML = `
                    ${!hasPassedGrand ? '<span class="lock-icon" aria-hidden="true">🔒</span>' : ''}
                    <div class="level-icon" aria-hidden="true" style="font-size: 2.2rem;">👹</div>
                    <div class="level-label" style="color: #ef4444; font-size: 1.3rem; text-shadow: 0 0 10px rgba(239,68,68,0.5);">THE FINAL BOSS</div>
                    <div class="level-range" style="color: #94a3b8;">Randomized Master Quizzes</div>
                    ${!hasPassedGrand
                        ? `<div class="master-hint" style="color: #64748b;">Pass the Grand Quiz first</div>`
                        : userData?.finalBossPassed
                            ? `<div class="master-hint" style="color: #4ade80;">👑 DEFEATED — YOU ARE THE FINAL BOSS!</div>`
                            : `<div class="master-hint" style="color: #f87171;">Only true masters dare enter</div>`}
                `;

                if (hasPassedGrand) {
                    bossCard.addEventListener('click', () => {
                        window.location.href = `quiz.html?type=boss`;
                    });
                    bossCard.addEventListener('keydown', (e) => {
                        if (e.key === 'Enter' || e.key === ' ') bossCard.click();
                    });
                } else {
                    bossCard.addEventListener('click', () => {
                        showToast('🔒 Complete the Grand Quiz first to awaken THE FINAL BOSS!');
                    });
                }
                grid.appendChild(bossCard);

                // Animate cards
                grid.querySelectorAll('.level-card').forEach((card, i) => {
                    card.style.animationDelay = `${i * 0.05}s`;
                });
                return;
            }

            // ── REGULAR CHAPTER VIEW (chapters 1–10) ──────────────────
            for (let l = 1; l <= LEVELS_PER_CHAP; l++) {
                const globalLevel = (chapter - 1) * LEVELS_PER_CHAP + l;
                const wordStart = (globalLevel - 1) * WORDS_PER_LEVEL + 1;
                const wordEnd = globalLevel * WORDS_PER_LEVEL;
                const isLocked = globalLevel > unlockedLevel;
                const isCompleted = globalLevel < unlockedLevel;

                const card = document.createElement('div');
                card.className = `level-card${isLocked ? ' locked' : ''}${isCompleted ? ' completed' : ''}`;
                card.setAttribute('role', 'button');
                card.setAttribute('tabindex', isLocked ? '-1' : '0');
                card.setAttribute('aria-label',
                    `Level ${l} of Chapter ${chapter}, words ${wordStart}–${wordEnd}${isLocked ? ', locked' : ''}`);

                card.innerHTML = `
                    ${isLocked ? '<span class="lock-icon" aria-hidden="true">🔒</span>' : ''}
                    <div class="level-icon" aria-hidden="true">${isCompleted ? '⭐' : '📖'}</div>
                    <div class="level-label">LEVEL ${l}-${chapter}</div>
                    <div class="level-range">Words ${wordStart}−${wordEnd}</div>
                `;

                if (!isLocked) {
                    card.addEventListener('click', () => {
                        window.location.href = `study.html?chapter=${chapter}&level=${l}`;
                    });
                    card.addEventListener('keydown', (e) => {
                        if (e.key === 'Enter' || e.key === ' ') card.click();
                    });
                } else {
                    card.addEventListener('click', () => {
                        showToast('🔒 Complete the previous level first!');
                    });
                }

                grid.appendChild(card);
            }

            // ── Master Quiz card ───────────────────────
            const allLevelsDone = unlockedLevel > chapter * LEVELS_PER_CHAP;
            const masterAlreadyPassed = unlockedChapter > chapter;
            const masterLocked = !allLevelsDone;

            const masterCard = document.createElement('div');
            masterCard.className = `level-card master-card${masterLocked ? ' locked' : ''}${masterAlreadyPassed ? ' completed' : ''}`;
            masterCard.setAttribute('role', 'button');
            masterCard.setAttribute('tabindex', masterLocked ? '-1' : '0');
            masterCard.setAttribute('aria-label',
                `Master Quiz for Chapter ${chapter}${masterLocked ? ' – locked until all 6 levels are done' : ''}`);

            const unlockNextMsg = chapter === 10 ? '⭐ Chapter X unlocked!' : `Chapter ${chapter + 1} unlocked!`;

            masterCard.innerHTML = `
                ${masterLocked ? '<span class="lock-icon" aria-hidden="true">🔒</span>' : ''}
                <div class="level-icon master-icon" aria-hidden="true">${masterAlreadyPassed ? '🏅' : '🏆'}</div>
                <div class="level-label master-label">MASTER QUIZ</div>
                <div class="level-range">Chapter ${chapter} · 50 Questions</div>
                ${masterLocked
                    ? `<div class="master-hint">Finish all 6 levels first</div>`
                    : masterAlreadyPassed
                        ? `<div class="master-hint master-passed">✅ Passed — ${unlockNextMsg}</div>`
                        : `<div class="master-hint">48 / 50 required · 3 mistakes = out</div>`}
            `;

            if (!masterLocked) {
                masterCard.addEventListener('click', () => {
                    window.location.href = `quiz.html?type=master&chapter=${chapter}`;
                });
                masterCard.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' || e.key === ' ') masterCard.click();
                });
            } else {
                masterCard.addEventListener('click', () => {
                    showToast('🔒 Complete all 6 levels of this chapter first!');
                });
            }

            grid.appendChild(masterCard);

            // Animate cards in
            grid.querySelectorAll('.level-card').forEach((card, i) => {
                card.style.animationDelay = `${i * 0.05}s`;
            });
        }
    </script>

</body>

</html>
