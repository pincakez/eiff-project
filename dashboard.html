<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard — EiFF Project</title>
    <meta name="description" content="Choose your level and start learning English vocabulary with EiFF.">
    <link rel="icon" href="assets/favicon.ico.png" type="image/png">
    <link rel="stylesheet" href="css/style.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Cairo:wght@400;600;700;800&family=Pacifico&display=swap"
        rel="stylesheet">
</head>

<body>

    <!-- TOPBAR -->
    <header class="topbar" role="banner">
        <a href="index.html" class="nav-logo" aria-label="EiFF Home">
            <img src="assets/logo-nav.png" alt="EiFF Project">
        </a>

        <!-- Chapter pills -->
        <nav class="nav-pills" id="chap-nav" aria-label="Chapter navigation"></nav>

        <div class="nav-actions">
            <button class="btn-secondary" id="btn-signout" aria-label="Sign out">Sign Out</button>
        </div>
    </header>

    <!-- MAIN -->
    <main>
        <!-- Page header + user badge -->
        <div class="page-header" id="page-header">
            <h1>📚 Level Selection</h1>
            <p>Choose a chapter, then pick your level to start studying.</p>
            <div class="user-badge" id="user-badge" aria-live="polite">
                <div class="user-badge-avatar" id="user-avatar">?</div>
                <span id="user-name">Loading…</span>
            </div>
        </div>

        <!-- Level Grid -->
        <section id="levels-container" aria-label="Study levels">
            <!-- Levels are built by JS -->
            <div class="loading-spinner" role="status">
                <div class="spinner"></div>
                <span>Loading your progress…</span>
            </div>
        </section>
    </main>

    <!-- TOAST -->
    <div class="toast" id="eiff-toast" role="status" aria-live="polite"></div>

    <!-- SCRIPTS -->
    <script type="module">
        import { auth, onAuthStateChanged, getUserData, eiffSignOut } from './js/firebase-config.js';
        import { showToast } from './js/auth-ui.js';

        // ─── Config ────────────────────────────────
        const TOTAL_CHAPTERS = 10;
        const LEVELS_PER_CHAP = 6;
        const WORDS_PER_LEVEL = 50;

        // Color cycle for chapter pills
        const CHAP_COLORS = [
            'var(--g-blue)', 'var(--g-red)', 'var(--g-green)', 'var(--g-yellow)',
            '#8B5CF6', '#F59E0B', '#06B6D4', '#EF4444', '#10B981', '#6366F1'
        ];

        // ─── State ─────────────────────────────────
        let currentUser = null;
        let userData = null;
        let activeChapter = 1;

        // ─── Auth Guard ─────────────────────────────
        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                // Not logged in — redirect to home
                window.location.href = 'index.html';
                return;
            }
            currentUser = user;
            userData = await getUserData(user.uid);

            // Populate user badge
            const name = userData?.displayName || user.email.split('@')[0];
            document.getElementById('user-name').textContent = name;
            document.getElementById('user-avatar').textContent = name[0].toUpperCase();

            // Build navigation & levels
            buildChapterNav();
            showChapterLevels(1);
        });

        // ─── Sign Out ───────────────────────────────
        document.getElementById('btn-signout').addEventListener('click', async () => {
            await eiffSignOut();
            window.location.href = 'index.html';
        });

        // ─── Build Chapter Nav Pills ─────────────────
        function buildChapterNav() {
            const nav = document.getElementById('chap-nav');
            nav.innerHTML = '';
            for (let c = 1; c <= TOTAL_CHAPTERS; c++) {
                const btn = document.createElement('button');
                btn.className = 'pill-btn' + (c === 1 ? ' active' : '');
                btn.textContent = `Chapter ${c}`;
                btn.id = `chap-btn-${c}`;
                btn.setAttribute('aria-pressed', c === 1 ? 'true' : 'false');
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.pill-btn').forEach(b => {
                        b.classList.remove('active');
                        b.setAttribute('aria-pressed', 'false');
                    });
                    btn.classList.add('active');
                    btn.setAttribute('aria-pressed', 'true');
                    activeChapter = c;
                    showChapterLevels(c);
                });
                nav.appendChild(btn);
            }
        }

        // ─── Show Levels for a Chapter ───────────────
        function showChapterLevels(chapter) {
            const container = document.getElementById('levels-container');
            const unlockedLevel = userData?.unlockedLevel ?? 1;

            // Compute which global level index these chapter levels map to
            // Global level = (chapter - 1) * 6 + localLevel
            container.innerHTML = '<div class="levels-grid" id="levels-grid"></div>';
            const grid = document.getElementById('levels-grid');

            for (let l = 1; l <= LEVELS_PER_CHAP; l++) {
                const globalLevel = (chapter - 1) * LEVELS_PER_CHAP + l;
                const wordStart = (globalLevel - 1) * WORDS_PER_LEVEL + 1;
                const wordEnd = globalLevel * WORDS_PER_LEVEL;
                const isLocked = globalLevel > unlockedLevel;
                const isCompleted = globalLevel < unlockedLevel;

                const card = document.createElement('div');
                card.className = `level-card${isLocked ? ' locked' : ''}${isCompleted ? ' completed' : ''}`;
                card.setAttribute('role', 'button');
                card.setAttribute('tabindex', isLocked ? '-1' : '0');
                card.setAttribute('aria-label', `Level ${l}-${chapter}, words ${wordStart} to ${wordEnd}${isLocked ? ', locked' : ''}`);

                card.innerHTML = `
                ${isLocked ? '<span class="lock-icon" aria-hidden="true">🔒</span>' : ''}
                <div class="level-icon" aria-hidden="true">${isCompleted ? '⭐' : '📖'}</div>
                <div class="level-label">LEVEL ${l}-${chapter}</div>
                <div class="level-range">Words ${wordStart}−${wordEnd}</div>
            `;

                if (!isLocked) {
                    card.addEventListener('click', () => {
                        // Navigate to study page
                        window.location.href = `study.html?chapter=${chapter}&level=${l}`;
                    });
                    card.addEventListener('keydown', (e) => {
                        if (e.key === 'Enter' || e.key === ' ') card.click();
                    });
                } else {
                    card.addEventListener('click', () => {
                        showToast('🔒 Complete the previous level first!');
                    });
                }

                grid.appendChild(card);
            }

            // Animate cards in
            const cards = grid.querySelectorAll('.level-card');
            cards.forEach((card, i) => {
                card.style.animationDelay = `${i * 0.05}s`;
            });
        }
    </script>

</body>

</html>
